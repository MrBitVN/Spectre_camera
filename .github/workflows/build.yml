name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android Build (100% Native Kotlin)
  # ==========================================
  android:
    name: Build Android (Kotlin + Jetpack Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('longexposure_android/**/*.gradle*', 'longexposure_android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x longexposure_android/gradlew

      - name: Run Unit Tests
        run: |
          cd longexposure_android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: |
          cd longexposure_android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Android APK
        run: |
          ls -lh longexposure_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectreFlow-Android-APK
          path: longexposure_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 2. iOS Build (100% Native Swift + SwiftUI)
  # ==========================================
  ios:
    name: Build iOS IPA (Swift + SwiftUI + Metal)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & System Info
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Run iOS Unit Tests
        run: |
          cd longexposure_ios
          # Run tests against the iOS Simulator
          xcodebuild test \
            -project SpectreFlow.xcodeproj \
            -scheme SpectreFlow \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -quiet || true

      - name: Build & Archive iOS App
        run: |
          cd longexposure_ios
          xcodebuild archive \
            -project SpectreFlow.xcodeproj \
            -scheme SpectreFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpectreFlow.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          cd longexposure_ios
          mkdir -p Payload
          cp -r build/SpectreFlow.xcarchive/Products/Applications/SpectreFlow.app Payload/
          zip -qr SpectreFlow.ipa Payload
          rm -rf Payload

      - name: Verify iOS IPA
        run: |
          ls -lh longexposure_ios/SpectreFlow.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectreFlow-iOS-IPA
          path: longexposure_ios/SpectreFlow.ipa
          if-no-files-found: error
          retention-days: 14
